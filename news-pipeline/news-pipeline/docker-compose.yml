# Extensions (non créées comme services) — ancres YAML pour Airflow
x-airflow-common: &airflow_common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  environment: &airflow_env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://datauser:datapass@postgres/news_dw
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: "supersecret"
    AIRFLOW__WEBSERVER__WORKERS: "1"
    AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: "300"
    # Indispensable pour la tâche scrape_articles (même réseau Docker que le service scraper)
    KAFKA_BOOTSTRAP: "kafka:9092"
    MINIO_ENDPOINT: "http://minio:9000"
    MINIO_ACCESS: "minioadmin"
    MINIO_SECRET: "minioadmin"
    # Moins de sites = run plus court pour la tâche Airflow (Lakom peut bloquer le DNS). Vider pour tout scraper.
    ONLY_SOURCES: "hespress,akhbarona,barlamane,aljazeera_ar,bbc_arabic,reuters"
  volumes: &airflow_volumes
    - ./airflow/dags:/opt/airflow/dags
    - ./scraper:/opt/scraper
    - airflow_logs:/opt/airflow/logs
  networks: &airflow_net
    - bigdata_net

services:

  # ─── DATA LAKE ───────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - bigdata_net

  minio_init:
    image: minio/mc:latest
    container_name: minio_init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/bronze || true;
      mc mb local/silver || true;
      mc mb local/gold   || true;
      echo 'Buckets créés';
      "
    networks:
      - bigdata_net

  # ─── KAFKA ───────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - bigdata_net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 15s
      retries: 18
      start_period: 45s
    networks:
      - bigdata_net

  # ─── POSTGRES ────────────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: datauser
      POSTGRES_PASSWORD: datapass
      POSTGRES_DB: news_dw
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init_dw.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datauser -d news_dw"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks:
      - bigdata_net

  # ─── AIRFLOW (init + webserver + scheduler — port 8080 fiable) ─
  airflow-init:
    <<: *airflow_common
    container_name: airflow-init
    user: "50000:0"
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        airflow db migrate
        airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@news.local || true

  airflow-webserver:
    <<: *airflow_common
    container_name: airflow-webserver
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    restart: unless-stopped
    command: ["webserver"]

  airflow-scheduler:
    <<: *airflow_common
    container_name: airflow-scheduler
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-webserver:
        condition: service_started
    restart: unless-stopped
    command: ["scheduler"]

  # ─── SCRAPER ─────────────────────────────────────────────────
  scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    container_name: scraper
    depends_on:
      kafka:
        condition: service_started
      minio:
        condition: service_started
      minio_init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS: minioadmin
      MINIO_SECRET: minioadmin
    networks:
      - bigdata_net

  # ─── STREAMING (Kafka → Silver MinIO) ───────────────────────
  kafka_consumer:
    image: python:3.11-slim
    container_name: kafka_consumer
    depends_on:
      kafka:
        condition: service_started
      minio:
        condition: service_started
      minio_init:
        condition: service_completed_successfully
    working_dir: /app
    volumes:
      - ./spark/kafka_consumer.py:/app/kafka_consumer.py:ro
    command: >
      bash -c "
        pip install --no-cache-dir kafka-python==2.0.2 minio==7.2.3 langdetect==1.0.9 &&
        python kafka_consumer.py
      "
    networks:
      - bigdata_net

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      postgres:
        condition: service_started
    networks:
      - bigdata_net

volumes:
  minio_data:
  postgres_data:
  airflow_logs:
  grafana_data:

networks:
  bigdata_net:
    driver: bridge
